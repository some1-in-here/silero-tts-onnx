name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + dev deps (no torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: "Smoke: package import stays torch-free + light CLI commands"
        run: |
          python -c "import sys, silero_onnx; assert 'torch' not in sys.modules; print('torch-free import OK')"
          python -c "from silero_onnx.engine import main; main(['--model-list'])"
          python -c "from silero_onnx.engine import main; main(['--speaker-list'])"

      - name: Test suite (model-dependent tests skip when models are absent)
        run: python -m pytest tests/ -q -rs

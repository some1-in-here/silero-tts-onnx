name: Export ONNX and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create or update (e.g. v0.4.0-rc1)"
        required: false
        default: ""

# contents: write is needed to create the Release and upload assets.
permissions:
  contents: write

jobs:
  export-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache torch.hub sources (snakers4 repo + checkpoints)
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub
          key: torch-hub-snakers4-v1
          restore-keys: |
            torch-hub-snakers4-

      - name: Install build env (torch CPU + export stack) and dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-export.txt
          python -m pip install -e ".[dev]"

      - name: Export fixtures + both model sets (v5_ru x5 + v5_6_ru x4; per-step gates)
        run: python scripts/export_all.py --out-dir models/onnx

      - name: "Integrity check (all 9 models: loads, I/O, robustness, smoke per version)"
        run: python scripts/check_models.py --models models/onnx

      - name: Torch-vs-ONNX end-to-end parity (v5; v5_6 gates run in its export step)
        run: python scripts/check_parity.py --models models/onnx

      - name: "Test suite (full: freshly built models are present)"
        run: python -m pytest tests/ -v

      - name: Pack all MODEL_SETS artifacts into the release ZIP
        run: |
          python scripts/package_models.py --models models/onnx --zip models/silero_onnx_models.zip
          ls -lh models/silero_onnx_models.zip models/onnx/*.onnx

      - name: Create GitHub Release with ZIP + individual models
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Manual runs: release under the chosen `version` input
          # (the tag is created if missing); tag pushes use their own tag.
          tag_name: ${{ inputs.version || github.ref_name }}
          # Suffixed release names (v1.0.0-rc, v1.0.0-beta, ...) become
          # pre-releases automatically; plain vX.Y.Z stays latest.
          prerelease: ${{ contains(inputs.version || github.ref_name, '-') }}
          files: |
            models/silero_onnx_models.zip
            models/onnx/acoustic_v5_ru.onnx
            models/onnx/vocoder_v5_ru.onnx
            models/onnx/istft_48k.onnx
            models/onnx/silero_stress.onnx
            models/onnx/ngram_core.onnx
            models/onnx/acoustic_v5_6_ru.onnx
            models/onnx/dur_predictor_v5_6_ru.onnx
            models/onnx/pitch_predictor_v5_6_ru.onnx
            models/onnx/vocoder_v5_6_ru.onnx
